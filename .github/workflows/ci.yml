# Runs on push and pull requests. If GitHub Actions is disabled for the repository (billing, see plan/CI_POSTPONED.md),
# enable it with `gh workflow enable CI`; the same checks run locally with `make quick`, `make types`, `make audit`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # the primary dev host is Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked --extra dev --extra hyphens
      - name: Tests (quick lane on pull requests, full lane otherwise)
        # Hermetic: marker-gated suites (ollama, live_bridge, browser) need a GPU host, a consumer checkout or
        # chromium and are excluded in both lanes.
        run: uv run python scripts/test_lane.py ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uvx ruff check llm_localizator tests scripts

  self-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked
      - name: Validate own catalogue
        # Dogfood: llm_localizator validates its own message catalogue.
        run: uv run llm-localizator validate --format github

  self-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked
      - name: Sync dry-run (backlog surface)
        run: uv run llm-localizator run-sync --dry-run

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: mypy ratchet (the error count may not rise)
        run: uv run python scripts/check_types.py

  coverage:
    # Serial quick lane (~4 min); push only so PRs stay fast.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Coverage ratchet (may not drop below scripts/coverage_floor.txt)
        run: uv run python scripts/coverage_gate.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Known vulnerabilities in locked dependencies
        run: |
          uv export --no-hashes --no-emit-project -o requirements.audit.txt
          uv run pip-audit -r requirements.audit.txt --no-deps

  module-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: python scripts/check_module_budgets.py
