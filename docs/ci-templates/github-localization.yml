# Localization check for pull requests (ADR-52).
#
# Runs the work manifest against the pull request and comments with what needs translating.
# It never translates anything: translation is a taskqueue job (ADR-1), not a CI step.
# Copy to .github/workflows/localization.yml and adjust the project path if needed.
name: Localization check
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install llm_localizator
      - name: Work manifest
        id: diff
        run: |
          set +e
          llm-localizator run-sync --diff --exit-nonzero --no-translate | tee diff.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Comment on the pull request
        if: steps.diff.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('diff.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Localization work in this pull request\n\n```\n' + summary + '\n```',
            });
      - name: Fail when strings need translation
        if: steps.diff.outputs.code != '0'
        run: exit 1
